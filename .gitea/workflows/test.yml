name: Test action

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: pip install --requirement requirements.txt

      - name: Run action
        uses: ./
        with:
          playbook: test.yml
          requirements: ""
          check: "false"
